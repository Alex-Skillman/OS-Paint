name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: OS-Paint-Client.exe
            asset_name: os-paint-client-windows.exe
          - os: macos-latest
            artifact_name: OS-Paint-Client
            asset_name: os-paint-client-macos
          - os: ubuntu-latest
            artifact_name: OS-Paint-Client
            asset_name: os-paint-client-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Rename binary for release
        shell: bash
        run: cp "target/release/${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # Republishes the binaries built above as a single rolling "latest"
  # GitHub Release every time master moves, so there's always a stable,
  # discoverable download link instead of digging through workflow run
  # artifacts. The old release/tag is deleted first so "latest" always
  # points at the newest commit rather than going stale.
  release:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Remove previous rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest -R ${{ github.repository }} --yes --cleanup-tag || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: >
            Automatically built from the latest commit on master
            (${{ github.sha }}). Overwritten on every push to master.
          files: dist/*
